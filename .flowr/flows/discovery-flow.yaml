flow: discovery-flow
version: 2.1.0
exits:
  - interview-ready
states:
  - id: interview-general
    attrs:
      description: >
        Funnel level 1 - General. Establish the big picture with the seven broad
        questions; begin the running interview-notes artifact.
      dispatch_to: product-owner
      specialists: [domain-expert]
      git branch: dev
      skills: [interview-general]
      output artifacts:
        - ".cache/<session_id>/interview-notes.md"
    next:
      general-done: interview-cross-cutting

  - id: interview-cross-cutting
    attrs:
      description: >
        Funnel level 2 - Cross-cutting. Structure the domain (behaviour groups,
        bounded contexts, integration points, lifecycle); append to the
        interview-notes.
      dispatch_to: product-owner
      specialists: [domain-expert]
      git branch: dev
      skills: [interview-cross-cutting]
      input artifacts:
        - ".cache/<session_id>/interview-notes.md"
      output artifacts:
        - ".cache/<session_id>/interview-notes.md"
    next:
      cross-cutting-done: interview-features

  - id: interview-features
    attrs:
      description: >
        Funnel level 3 - Feature identification. Capture feature NAMES and rough
        boundaries only; run gap analysis; append to the interview-notes.
      dispatch_to: product-owner
      specialists: [domain-expert]
      git branch: dev
      skills: [interview-features]
      input artifacts:
        - ".cache/<session_id>/interview-notes.md"
      output artifacts:
        - ".cache/<session_id>/interview-notes.md"
    next:
      features-identified: consolidate-interview

  - id: consolidate-interview
    attrs:
      description: >
        Active listening L3. Synthesize all three levels into the final notes
        for stakeholder approval and author the glossary; the accuracy gate for
        plan.
      dispatch_to: product-owner
      specialists: [domain-expert]
      git branch: dev
      skills: [consolidate-interview]
      input artifacts:
        - ".cache/<session_id>/interview-notes.md"
      output artifacts:
        - ".cache/<session_id>/interview-notes.md"
        - "docs/glossary.md"
    next:
      consolidated: interview-ready
      needs-more-elicitation: interview-general
