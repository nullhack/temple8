flow: deliver-flow
version: 1.3.0
exits:
  - delivered
states:
  - id: merge
    attrs:
      description: >
        Squash-merge the feature commits into dev with the full suite and
        whole-suite stubtest green on dev.
      dispatch_to: release-engineer
      git branch: dev
      skills: [merge-to-dev]
      input artifacts:
        - "feature-commits"
      output artifacts:
        - "dev"
    conditions:
      merged:
        tests-green-on-dev: "==true"
        stubtest-clean-on-dev: "==true"
    next:
      merged:
        to: publish
        when: merged

  - id: publish
    attrs:
      description: >
        Publish the batch as release notes, a PR to main, or a tagged release.
      dispatch_to: release-engineer
      git branch: dev
      skills: [publish-release]
      input artifacts:
        - "dev"
      output artifacts:
        - "release"
    next:
      published: delivered
